name: Build & Release Module

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: "YouTube version (leave empty for auto-detect from patches)"
        type: string
        required: false
      force_rebuild:
        description: "Force rebuild even if nothing changed"
        type: boolean
        default: false
      notify_telegram:
        description: "Send result to Telegram channel"
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Telethon
        run: pip install --quiet telethon

      - name: Configure env
        run: |
          echo "WORK_DIR=${{ github.workspace }}/work" >> "$GITHUB_ENV"
          echo "OUT_DIR=${{ github.workspace }}/out" >> "$GITHUB_ENV"
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/morphe.keystore
            echo "Keystore restored from secret - signature konsisten antar build."
          else
            echo "::warning::KEYSTORE_BASE64 tidak diset - keystore baru akan dibuat (signature berubah tiap build!)"
          fi

      - name: Fetch sources (Morphe CLI + Anddea patches)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-sources.sh

      - name: Resolve YouTube version
        run: |
          if [ -n "${{ inputs.youtube_version }}" ]; then
            echo "Using manual version: ${{ inputs.youtube_version }}"
            bash scripts/set-version.sh "${{ inputs.youtube_version }}"
          else
            echo "Auto-detecting latest supported version..."
            VERSION="$(bash scripts/detect-version.sh)"
            echo "Detected: $VERSION"
            bash scripts/set-version.sh "$VERSION"
          fi

      - name: Check if rebuild is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('config/patches.json'))['youtube_version'])")"
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          FP="$(sha256sum config/patches.json | cut -d' ' -f1)-$(cat work/.cli)-$(cat work/.patches)"
          STORED="$(cat .last-fingerprint 2>/dev/null || echo none)"
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "Force rebuild requested."
          elif gh release view "$TAG" >/dev/null 2>&1 && [ "$FP" = "$STORED" ]; then
            echo "Nothing changed since last build ($TAG). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect new YouTube version
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Badge [VERSI BARU] di Telegram hanya jika release utk versi ini belum ada.
          if gh release view "${{ env.TAG }}" >/dev/null 2>&1; then
            echo "NEW_VERSION=false" >> "$GITHUB_ENV"
          else
            echo "NEW_VERSION=true" >> "$GITHUB_ENV"
            echo "Versi baru terdeteksi: ${{ env.TAG }}"
          fi

      - name: Download stock YouTube APK
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/download-apk.sh

      - name: Fetch MicroG for Telegram upload
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-microg.sh

      - name: Patch APK
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/patch-apk.sh

      - name: Verify APKs and module zip
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/verify-apk.sh

      - name: Build Magisk module zip
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/build-module.sh

      - name: Update update.json + changelog
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/update-json.sh

      - name: Commit metadata
        if: steps.check.outputs.skip != 'true'
        run: |
          FP="$(sha256sum config/patches.json | cut -d' ' -f1)-$(cat work/.cli)-$(cat work/.patches)"
          echo "$FP" > .last-fingerprint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md config/patches.json .last-fingerprint
          git diff --cached --quiet || {
            git commit -m "chore: update build metadata $(date +%F)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          }

      - name: Publish GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.TAG }}"
          VERSION="$(echo "$TAG" | sed 's/^v//')"
          cp work/youtube-patched.apk "out/YTPatched_NON_ROOT-$VERSION.apk"
          [ -f work/youtube-cloned.apk ] && cp work/youtube-cloned.apk "out/YTPatched_CLONE-$VERSION.apk"
          [ -f work/microg.apk ] && cp work/microg.apk out/MicroG.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" out/YTPatched_ROOT-$VERSION.zip \
            out/YTPatched_NON_ROOT-$VERSION.apk \
            $( [ -f out/YTPatched_CLONE-$VERSION.apk ] && echo out/YTPatched_CLONE-$VERSION.apk ) \
            $( [ -f out/MicroG.apk ] && echo out/MicroG.apk ) \
            --title "YouTube Patched FALABS $TAG" \
            --notes-file changelog.md \
            --latest

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-rvx-module
          path: |
            out/*.zip
            out/*.apk
          if-no-files-found: error

      - name: Send to Telegram
        if: steps.check.outputs.skip != 'true' && inputs.notify_telegram != false
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: bash scripts/telegram.sh
